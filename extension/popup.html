<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head><body><header><b class="logo">↗</b><div><strong>MoveCursor</strong><small>VIRTUAL CURSOR</small></div></header><div id="connection" class="connection">Checking connection…</div><label>Desktop pairing code<input id="token" placeholder="Paste code from desktop"></label><button id="pairButton">CONNECT DESKTOP</button><div class="settings"><label>Travel duration (ms)<div><input id="min" type="number" value="400" min="100"><input id="max" type="number" value="1800" min="150"></div></label><label>Pause duration (ms)<div><input id="pmin" type="number" value="100" min="0"><input id="pmax" type="number" value="600" min="0"></div></label><label>Cursor size <input id="size" type="number" value="18" min="10" max="48"></label><label class="click-toggle"><input id="clicks" type="checkbox" checked> Click new page targets continuously</label><small class="warning">Each target is clicked once per run. Clicks can activate controls or follow links.</small></div><div class="buttons"><button class="primary" id="draw">DRAW BOX</button><button id="start">START MOVEMENT</button><button id="stop">STOP MOVEMENT</button><button class="clear" id="clear">CLEAR SELECTION</button></div><script src="popup.js"></script></body></html>
